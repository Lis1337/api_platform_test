services:
  app:
    build:
      dockerfile: ./docker/php/Dockerfile
    container_name: app
    volumes:
      - ./:/var/www/app
    ports:
      - "8000:8000"
    networks:
      - app_db
  db:
    image: mysql:latest
    container_name: db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    env_file:
      - .env
    networks:
      - app_db

networks:
  app_db:
    external: false
