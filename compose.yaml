services:
  app:
    build:
      dockerfile: ./docker/php/Dockerfile
    container_name: app
    volumes:
      - ./:/var/www/app
    ports:
      - "8000:8000"
    networks:
      - app_db
  db:
    image: mysql:latest
    container_name: db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    env_file:
      - .env
    networks:
      - app_db
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/log:/var/log/nginx
    depends_on:
      - app
    networks:
      - app_db

networks:
  app_db:
    external: false
